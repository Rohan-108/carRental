<div
  class="container"
  style="
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  "
>
  <div class="row" style="width: 100%; position: relative">
    <div
      ng-show="isLoading"
      style="
        position: absolute;
        inset: 0;
        background-color: rgba(255, 255, 255, 0.7);
        z-index: 1050;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
      "
    >
      <div class="text-center">
        <div
          class="spinner"
          style="
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #337ab7;
            animation: spin 1s linear infinite;
          "
        ></div>
        <p
          class="lead"
          style="margin-top: 15px; font-weight: bold; color: #337ab7"
        >
          Loading...
        </p>
      </div>
    </div>
    <div class="col-md-6 col-md-offset-3">
      <!-- Header -->
      <div class="text-center" style="padding-top: 48px; padding-bottom: 24px">
        <h1>
          <a
            href="#"
            style="
              color: #333;
              font-weight: 600;
              letter-spacing: 0.5px;
              text-decoration: none;
            "
            aria-label="Go to Rent IT homepage"
          >
            Welcome <span style="color: #5469d4">To</span> Rent
            <span style="color: #5469d4">IT</span>
          </a>
        </h1>
      </div>

      <!-- Form Panel--->
      <div
        class="panel panel-default"
        style="
          box-shadow: rgba(60, 66, 87, 0.12) 0px 7px 14px 0px,
            rgba(0, 0, 0, 0.12) 0px 3px 6px 0px;
          border-radius: 8px;
          border: none;
          max-width: 448px;
          margin: 0 auto;
        "
      >
        <div class="panel-body" style="padding: 48px">
          <p
            class="lead text-center"
            style="
              margin-bottom: 24px;
              font-weight: 600;
              color: #333;
              font-size: 20px;
            "
          >
            Sign in to your account
          </p>

          <!-- Login Form  -->
          <form name="loginForm" novalidate ng-submit="submitLogin()">
            <!-- Email Field -->
            <div class="form-group">
              <label
                for="email"
                style="font-weight: 500; margin-bottom: 8px; color: #424770"
                >Email</label
              >
              <div class="input-group">
                <span
                  class="input-group-addon"
                  style="
                    background-color: #f7fafc;
                    border-color: rgba(60, 66, 87, 0.16);
                  "
                >
                  <i
                    class="glyphicon glyphicon-envelope"
                    style="color: #5469d4"
                  ></i>
                </span>
                <input
                  type="email"
                  class="form-control input-lg"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  ng-required="true"
                  ng-pattern="/^[^\s@]+@[^\s@]+\.[^\s@]+$/"
                  ng-model="loginData.email"
                  ng-class="{'has-error': loginForm.email.$touched && loginForm.email.$invalid}"
                  style="
                    height: 44px;
                    font-size: 16px;
                    border-color: rgba(60, 66, 87, 0.16);
                    box-shadow: none;
                    outline-color: rgba(84, 105, 212, 0.5);
                  "
                />
              </div>

              <!-- Email validation message with  Bootstrap alert -->
              <div
                ng-show="loginForm.email.$touched && loginForm.email.$invalid"
              >
                <div
                  class="alert alert-danger"
                  style="font-size: 14px; margin-top: 6px; padding: 5px"
                >
                  <span ng-show="loginForm.email.$error.required"
                    >Email is required.</span
                  >
                  <span ng-show="loginForm.email.$error.pattern"
                    >Please enter a valid email format.</span
                  >
                </div>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group" style="margin-bottom: 24px">
              <label
                for="password"
                style="font-weight: 500; margin-bottom: 8px; color: #424770"
                >Password</label
              >
              <div class="input-group">
                <span
                  class="input-group-addon"
                  style="
                    background-color: #f7fafc;
                    border-color: rgba(60, 66, 87, 0.16);
                  "
                >
                  <i
                    class="glyphicon glyphicon-lock"
                    style="color: #5469d4"
                  ></i>
                </span>
                <input
                  type="password"
                  class="form-control input-lg"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  ng-required="true"
                  ng-model="loginData.password"
                  ng-class="{'has-error': loginForm.password.$touched && loginForm.password.$invalid}"
                  style="
                    height: 44px;
                    font-size: 16px;
                    border-color: rgba(60, 66, 87, 0.16);
                    box-shadow: none;
                    outline-color: rgba(84, 105, 212, 0.5);
                  "
                />
              </div>

              <!-- Password validation message -->
              <div
                ng-show="loginForm.password.$touched && loginForm.password.$error.required"
              >
                <div
                  class="alert alert-danger"
                  style="font-size: 14px; margin-top: 6px; padding: 5px"
                >
                  Password is required.
                </div>
              </div>
            </div>

            <!-- Submit Button-->
            <div style="margin-top: 32px">
              <button
                type="submit"
                class="btn btn-primary btn-lg btn-block"
                ng-disabled="loginForm.$invalid"
                data-toggle="tooltip"
                data-placement="top"
                title="Please complete the form"
                style="
                  background-color: #5469d4;
                  border-color: #5469d4;
                  height: 44px;
                  font-size: 16px;
                  font-weight: 600;
                  box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 1px 0px,
                    rgb(84, 105, 212) 0px 0px 0px 1px,
                    rgba(60, 66, 87, 0.08) 0px 2px 5px 0px;
                  transition: all 0.2s ease;
                "
              >
                Login
              </button>
            </div>
          </form>

          <!-- Register Link -->
          <div class="text-center" style="margin-top: 32px">
            <span style="color: #6b7c93">Don't have an account?</span>
            <a
              ui-sref="register"
              class="btn btn-link"
              aria-label="Go to Register page"
              data-toggle="tooltip"
              data-placement="right"
              title="Create a new account"
              style="color: #2949e7; font-weight: 500"
            >
              Register
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  .has-error .form-control {
    border-color: #e74c3c;
    box-shadow: 0 0 5px rgba(231, 76, 60, 0.5);
  }
</style>
